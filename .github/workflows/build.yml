name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versie bepalen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: App bouwen
        run: ./scripts/build-app.sh

      - name: Download beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: TimeTrack-${{ env.VERSION }}
          path: build/TimeTrack-${{ env.VERSION }}.zip

      - name: Release publiceren (bij een tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/TimeTrack-$VERSION.zip" --title "TimeTrack $VERSION" --generate-notes
