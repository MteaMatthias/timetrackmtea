name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release maken met dit versienummer (bv. 0.3.0); leeg = enkel bouwen"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versie bepalen
        run: |
          if [[ -n "${{ github.event.inputs.release }}" ]]; then
            echo "VERSION=${{ github.event.inputs.release }}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${{ github.event.inputs.release }}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Ondertekeningscertificaat importeren
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        if: env.CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Zelfondertekend: als vertrouwd markeren voor codesigning op de build-machine.
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys -passin "pass:$CERT_PASSWORD" -out "$RUNNER_TEMP/cert.pem" || true
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem" || true
          security find-identity -p codesigning

      - name: Tests
        run: TIMETRACK_DATA_DIR="$RUNNER_TEMP/tt-test" swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: App bouwen
        run: ./scripts/build-app.sh 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Fouten en waarschuwingen tonen
        if: always()
        run: |
          cat test.log build.log 2>/dev/null | grep -E "(error|warning):|failed|XCTAssert|Executed [0-9]+ test" | grep -v "^warning: " | sort -u | head -40 | while IFS= read -r line; do
            echo "::warning::${line//$'\n'/ }"
          done

      - name: Download beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: TimeTrack-${{ env.VERSION }}
          path: build/TimeTrack.zip

      - name: Waarschuwing zonder vast certificaat
        if: env.RELEASE_TAG != ''
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::Release zonder vast certificaat (SIGNING_CERT_P12): macOS vraagt na deze update opnieuw om toestemmingen. Zie README."
          fi

      - name: Release publiceren
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" build/TimeTrack.zip scripts/install.sh \
            --target "$GITHUB_SHA" --title "TimeTrack $VERSION" --generate-notes
