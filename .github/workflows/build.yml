name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release maken met dit versienummer (bv. 0.3.0); leeg = enkel bouwen"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versie bepalen
        run: |
          if [[ -n "${{ github.event.inputs.release }}" ]]; then
            echo "VERSION=${{ github.event.inputs.release }}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${{ github.event.inputs.release }}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Ondertekeningscertificaat importeren
        id: cert
        continue-on-error: true
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        if: env.CERT_P12 != ''
        run: |
          fail() { echo "::error::Certificaat: $1"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN" || fail "keychain aanmaken"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN" || fail "keychain ontgrendelen"
          # Spaties of regeleinden uit het geplakte geheim halen.
          printf '%s' "$CERT_P12" | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/cert.p12" 2>"$RUNNER_TEMP/b64.err" \
            || fail "SIGNING_CERT_P12 is geen geldige base64 ($(head -c 200 "$RUNNER_TEMP/b64.err"))"
          echo "p12: $(wc -c < "$RUNNER_TEMP/cert.p12") bytes"
          PW="$(printf '%s' "$CERT_PASSWORD" | tr -d ' \r\n\t')"
          # OpenSSL 3 maakt .p12-bestanden (AES/SHA-256) die de macOS-sleutelhanger niet leest ("MAC verification
          # failed"). Eerst controleren of het wachtwoord klopt, dan omzetten naar het klassieke formaat.
          OPENSSL=$(command -v /opt/homebrew/opt/openssl@3/bin/openssl || command -v /usr/local/opt/openssl@3/bin/openssl || command -v openssl)
          echo "openssl: $($OPENSSL version)"
          $OPENSSL pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin "pass:$PW" -nodes -out "$RUNNER_TEMP/all.pem" 2>"$RUNNER_TEMP/ossl.err" \
            || $OPENSSL pkcs12 -legacy -in "$RUNNER_TEMP/cert.p12" -passin "pass:$PW" -nodes -out "$RUNNER_TEMP/all.pem" 2>>"$RUNNER_TEMP/ossl.err" \
            || fail "het wachtwoord past niet bij het certificaat ($(tr '\n' ' ' < "$RUNNER_TEMP/ossl.err" | head -c 200))"
          $OPENSSL pkcs12 -export -legacy -in "$RUNNER_TEMP/all.pem" -name "MTEA TimeTrack" -passout "pass:$PW" -out "$RUNNER_TEMP/legacy.p12" 2>/dev/null \
            || $OPENSSL pkcs12 -export -in "$RUNNER_TEMP/all.pem" -name "MTEA TimeTrack" -passout "pass:$PW" -out "$RUNNER_TEMP/legacy.p12" \
            || fail "omzetten naar het klassieke formaat mislukt"
          rm -f "$RUNNER_TEMP/all.pem"
          OUT=$(security import "$RUNNER_TEMP/legacy.p12" -k "$KEYCHAIN" -P "$PW" -T /usr/bin/codesign 2>&1) \
            || fail "importeren mislukt: ${OUT//$'\n'/ }"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" >/dev/null || fail "toegang voor codesign"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Zelfondertekend: als vertrouwd markeren voor codesigning op de build-machine.
          $OPENSSL pkcs12 -in "$RUNNER_TEMP/legacy.p12" -clcerts -nokeys -passin "pass:$PW" -out "$RUNNER_TEMP/cert.pem" 2>/dev/null \
            || $OPENSSL pkcs12 -legacy -in "$RUNNER_TEMP/legacy.p12" -clcerts -nokeys -passin "pass:$PW" -out "$RUNNER_TEMP/cert.pem" 2>/dev/null || true
          [ -s "$RUNNER_TEMP/cert.pem" ] && sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem" || true
          security find-identity -p codesigning "$KEYCHAIN"
          echo "::notice::Certificaat ingeladen: $(security find-identity -p codesigning "$KEYCHAIN" | grep -c 'MTEA TimeTrack') identiteit(en)"

      - name: E2E – nep-Flow bouwen
        run: ./E2E/build-fakeflow.sh

      - name: E2E – Toegankelijkheid voor het testproces (enkel op de wegwerp-runner)
        run: ./E2E/grant-accessibility.sh

      - name: Tests
        timeout-minutes: 25
        run: TIMETRACK_E2E=1 TIMETRACK_DATA_DIR="$RUNNER_TEMP/tt-test" swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: E2E-diagnose tonen
        if: always()
        run: |
          grep -E "E2E(-DIAG|-SKIP)?:" test.log | head -60 | while IFS= read -r line; do
            echo "::notice::${line}"
          done
          grep -A30 "ONOPGEVANGEN NSException" test.log || true

      - name: App bouwen
        run: ./scripts/build-app.sh 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Fouten en waarschuwingen tonen
        if: always()
        run: |
          # Eerst de namen van de mislukte tests (kort), dan de details.
          grep -oE "Test Case '-\[[^]]+\]' failed" test.log 2>/dev/null | sort -u | sed -E "s/Test Case '-\[TimeTrackTests\.//; s/\]' failed//" | head -80 | while IFS= read -r line; do
            echo "::warning::MISLUKT $line"
          done
          cat test.log build.log 2>/dev/null | grep -E "(error|warning):|XCTAssert|Executed [0-9]+ test|Fatal" | grep -v "^warning: " \
            | sed -E 's#/Users/runner/work/[^ ]*/Tests/#Tests/#' | sort -u | head -120 > failures.txt || true
          # GitHub toont maar 10 meldingen per stap: alles in één melding, regel per regel.
          if [ -s failures.txt ]; then
            echo "::warning title=Details::$(sed 's/%/%25/g' failures.txt | awk '{printf "%s%%0A", $0}')"
          fi

      - name: Download beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: TimeTrack-${{ env.VERSION }}
          path: build/TimeTrack.zip

      - name: Release enkel met vast certificaat
        if: env.RELEASE_TAG != '' && steps.cert.outcome != 'success'
        run: |
          echo "::error::Geen release zonder vast certificaat: anders verliest iedereen na de update de toestemmingen. Zet SIGNING_CERT_P12 en SIGNING_CERT_PASSWORD correct (zie README)."
          exit 1

      - name: Release publiceren
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" build/TimeTrack.zip scripts/install.sh \
            --target "$GITHUB_SHA" --title "TimeTrack $VERSION" --generate-notes
